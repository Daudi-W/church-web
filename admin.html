<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>服事平台管理後台</title>
<link rel="stylesheet" href="admin.css?v=2">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="service-runtime-config.js"></script>

<script>

  </section>
  <div id="app" hidden><main id="main"></main></div>
</div>
<nav class="nav" id="nav" aria-label="主要分頁" hidden></nav>
